name: Manual Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

permissions:
  contents: write
  actions: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump_version
        run: |
          CURRENT_VERSION=$(node -p "require('./apps/web/package.json').version")
          echo "Current Version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Update version based on input type
          case "${{ github.event.inputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New Version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update the dashboard's package.json, which carries the release version
          bun --eval "
            import { readFileSync, writeFileSync } from 'fs';
            const pkg = JSON.parse(readFileSync('apps/web/package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            writeFileSync('apps/web/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Generate changelog preview
        id: changelog
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "📝 This is the first version release"
            COMMITS=$(git log --oneline --no-decorate | head -n 10)
          else
            echo "📝 Changes since $LAST_TAG:"
            COMMITS=$(git log --oneline --no-decorate ${LAST_TAG}..HEAD)
          fi

          echo "$COMMITS"

      - name: Commit and push version bump
        run: |
          git add apps/web/package.json

          if git diff --cached --quiet; then
            echo "⚠️ No version changes to commit"
            exit 1
          else
            git commit -m "chore(release): bump version to ${{ steps.bump_version.outputs.version }}"
            git push
            echo "✅ Version updated to ${{ steps.bump_version.outputs.version }} and pushed to the repository"
            echo "📦 release workflow will automatically create tag v${{ steps.bump_version.outputs.version }}"
          fi

      # A push made with GITHUB_TOKEN starts no push-triggered workflow, so the release and the image build start here.
      - name: Start release and image workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref "${{ github.ref_name }}"
          gh workflow run docker-build.yml --ref "${{ github.ref_name }}"
