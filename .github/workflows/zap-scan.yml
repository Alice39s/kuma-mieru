name: Dynamic Analysis (OWASP ZAP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      UPTIME_KUMA_URLS: https://example.kuma-mieru.invalid/status/default
      KUMA_MIERU_TITLE: Kuma Mieru
      KUMA_MIERU_DESCRIPTION: Test instance for dynamic analysis
      CI_MODE: true
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Start application
        run: |
          bun run start &
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200\|307"; then
              echo "Application is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to start"
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          install -d -m 0777 zap-reports
          set +e
          docker run --network host -v "$PWD/zap-reports:/zap/wrk:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md
          zap_status=$?
          set -e
          case "$zap_status" in
            0|1) ;;
            *) exit "$zap_status" ;;
          esac
          test -s zap-reports/zap-report.html
          test -s zap-reports/zap-report.json
          test -s zap-reports/zap-report.md

      - name: Stop application
        if: always()
        run: kill $(pgrep -f 'bun .*/server.js') || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-baseline-report-${{ github.sha }}
          path: zap-reports/
          if-no-files-found: error
          retention-days: 14
