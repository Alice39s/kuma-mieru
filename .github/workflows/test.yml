name: Tests

on:
  push:
    branches: [main, v1-exp]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Generate configuration and route types
        env:
          UPTIME_KUMA_URLS: http://127.0.0.1:43880/status/default
        run: |
          bun tests/fixtures/upstream.ts &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          bun run generate
          bunx next typegen

      - name: Check types and lint
        run: bun run lint
