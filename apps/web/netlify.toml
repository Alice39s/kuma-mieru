# Netlify builds from the repository root, where bun.lock and .nvmrc are; set the package directory to apps/web.
# Paths are relative to the root.
[build]
command = "bun run --cwd apps/web build"
publish = "apps/web/.next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[template.environment]
UPTIME_KUMA_URLS = "Uptime Kuma status page URL(s), separate multiple URLs with |"
