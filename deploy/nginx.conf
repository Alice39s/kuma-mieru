worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format edge '$remote_addr - $request_method $uri $status $body_bytes_sent '
                  '"$http_user_agent" cache=$upstream_cache_status';
  access_log /dev/stdout edge;
  error_log /dev/stderr warn;

  proxy_cache_path /var/cache/nginx/og
    levels=1:2
    keys_zone=kuma_mieru_og:10m
    max_size=64m
    inactive=24h
    use_temp_path=off;

  server {
    listen 8080;
    listen [::]:8080;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kuma_mieru_app http://kuma-mieru:3000;

    location = /health/edge {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location ~ ^/status/[^/]+(?:/metrics|/methodology)?$ {
      return 308 $scheme://$http_host$uri/$is_args$args;
    }

    location ~ /opengraph\.png$ {
      proxy_pass $kuma_mieru_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 65s;
      proxy_send_timeout 10s;

      proxy_cache kuma_mieru_og;
      proxy_cache_key $uri;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;
      proxy_cache_background_update on;
      proxy_cache_revalidate on;
      proxy_cache_valid 200 5m;
      proxy_cache_valid 404 30s;
      proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;

      proxy_intercept_errors on;
      error_page 500 502 503 504 =200 /_kuma_mieru_og_fallback;
      add_header X-Kuma-Mieru-Edge-Cache $upstream_cache_status always;
    }

    location = /_kuma_mieru_og_fallback {
      internal;
      root /usr/share/nginx/html;
      try_files /opengraph-fallback.png =404;
      add_header Cache-Control "public, max-age=60" always;
      add_header X-Kuma-Mieru-OG fallback always;
      add_header X-Kuma-Mieru-Edge-Cache FALLBACK always;
    }

    location / {
      proxy_pass $kuma_mieru_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 65s;
      proxy_send_timeout 10s;
    }
  }
}
